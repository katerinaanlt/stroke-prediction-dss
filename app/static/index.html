<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stroke Risk Decision Support System</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 550px; margin: 40px auto; padding: 20px; background: #f8fafc; }
    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.9rem; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 20px; width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
    #result { margin-top: 20px; padding: 12px; border-radius: 4px; display: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Clinical Stroke Risk Assessment</h2>
    <form id="strokeForm">
      <label>Age</label><input type="number" step="0.1" id="age" value="67" required>
      <label>Gender</label>
      <select id="gender"><option value="Male">Male</option><option value="Female">Female</option></select>
      <label>Hypertension</label>
      <select id="hypertension"><option value="0">No</option><option value="1">Yes</option></select>
      <label>Heart Disease</label>
      <select id="heart_disease"><option value="0">No</option><option value="1">Yes</option></select>
      <label>Ever Married</label>
      <select id="ever_married"><option value="Yes">Yes</option><option value="No">No</option></select>
      <label>Work Type</label>
      <select id="work_type">
        <option value="Private">Private</option><option value="Self-employed">Self-employed</option>
        <option value="Govt_job">Government Job</option><option value="children">Children</option>
        <option value="Never_worked">Never Worked</option>
      </select>
      <label>Residence Type</label>
      <select id="Residence_type"><option value="Urban">Urban</option><option value="Rural">Rural</option></select>
      <label>Average Glucose Level (mg/dL)</label><input type="number" step="0.01" id="avg_glucose_level" value="228.69" required>
      <label>BMI</label><input type="number" step="0.1" id="bmi" value="36.6" required>
      <label>Smoking Status</label>
      <select id="smoking_status">
        <option value="formerly smoked">Formerly Smoked</option><option value="never smoked">Never Smoked</option>
        <option value="smokes">Smokes</option><option value="Unknown">Unknown</option>
      </select>
      <button type="submit">Evaluate Stroke Risk</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById('strokeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        age: parseFloat(document.getElementById('age').value),
        gender: document.getElementById('gender').value,
        hypertension: parseInt(document.getElementById('hypertension').value),
        heart_disease: parseInt(document.getElementById('heart_disease').value),
        ever_married: document.getElementById('ever_married').value,
        work_type: document.getElementById('work_type').value,
        Residence_type: document.getElementById('Residence_type').value,
        avg_glucose_level: parseFloat(document.getElementById('avg_glucose_level').value),
        bmi: parseFloat(document.getElementById('bmi').value),
        smoking_status: document.getElementById('smoking_status').value
      };

      const resBox = document.getElementById('result');
      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        resBox.style.display = 'block';
        resBox.style.background = data.stroke_prediction === 'Yes' ? '#fee2e2' : '#dcfce7';
        resBox.textContent = `Predicted High Risk: ${data.stroke_prediction} (Estimated Probability: ${data.stroke_probability}%)`;
      } catch (err) {
        resBox.style.display = 'block';
        resBox.textContent = 'Error communicating with prediction API.';
      }
    });
  </script>
</body>
</html>
